services:
  kryptnet-scanner:
    build:
      context: .
      dockerfile: scanner-worker/Dockerfile
    container_name: kryptnet-scanner
    ports:
      - "127.0.0.1:5200:8000"
    env_file:
      - .env.scanner
    volumes:
      - ./data:/workspace/data
      - ./samples:/workspace/samples:ro
    restart: unless-stopped
