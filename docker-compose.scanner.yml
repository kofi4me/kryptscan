services:
  kryptnet-scanner:
    build:
      context: .
      dockerfile: scanner-worker/Dockerfile
    container_name: kryptnet-scanner
    ports:
      - "8000:8000"
    env_file:
      - .env.scanner
    volumes:
      - ./data:/workspace/data
      - ./samples:/workspace/samples:ro
    restart: unless-stopped
