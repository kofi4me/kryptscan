name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install application and audit tools
        run: python -m pip install -r requirements.txt pip-audit bandit
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Generate full Bandit report
        run: bandit -r app scanner-worker/app -x tests -f json -o bandit-report.json --exit-zero
      - name: Reject high-severity Python findings
        run: bandit -q -r app scanner-worker/app -x tests -lll
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
