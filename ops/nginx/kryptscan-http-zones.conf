# Install in /etc/nginx/conf.d/kryptscan-http-zones.conf (http context).
limit_req_zone $binary_remote_addr zone=kryptscan_general:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=kryptscan_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=kryptscan_connections:10m;
map $http_upgrade $kryptscan_connection_upgrade {
    default upgrade;
    '' close;
}
