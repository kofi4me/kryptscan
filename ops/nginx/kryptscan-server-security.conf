# Include inside the kryptscan.kryptnet.org TLS server block.
server_tokens off;
client_max_body_size 2m;
client_body_timeout 15s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 30s;
limit_conn kryptscan_connections 30;
limit_req zone=kryptscan_general burst=40 nodelay;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# The application owns Content-Security-Policy so Nginx does not add a second,
# conflicting policy. Keep the application policy restrictive and reviewed.

# Block secret files, VCS metadata, backups, and common framework probes before proxying.
location ~* (^|/)(\.env|\.git|\.svn|\.hg|credentials|id_rsa|config\.(json|ya?ml)|parameters\.ya?ml)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(bak|old|orig|save|sql|sqlite3?|log|ini|conf|ya?ml)$ {
    deny all;
    access_log off;
    log_not_found off;
}
